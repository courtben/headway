<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Set bigger goals, see your pace and work ahead.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Headway</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Headway">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone column. Overview = hairline list of goals with thin tick bars (pace marker).
   Goal view = cards: pace chart, plan bars per week, months. Bottom dock for the main action; bottom sheets for forms.
   Theme: light by default; dark is a setting in the app (data-app-theme on <html>), not the OS. */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#101114; --muted:#686A72; --line:#E3E4E8; --track:#EDEEF1; --ghost:#C9CCD3;
  --accent:#2B59F0; --accent-text:#1F47C9; --accent-soft:rgba(43,89,240,.12); --on-accent:#FFFFFF;
  --behind:#9A5800; --behind-soft:rgba(154,88,0,.12); --danger:#C2363F; --scrim:rgba(16,17,20,.36); --shadow:0 18px 50px rgba(16,17,20,.16);
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
:root[data-app-theme="dark"]{
  --bg:#0C0D10; --card:#131419; --ink:#F1F2F4; --muted:#9A9CA4; --line:#26282E; --track:#202227; --ghost:#3E4148;
  --accent:#5C83FF; --accent-text:#8AA6FF; --accent-soft:rgba(92,131,255,.2); --on-accent:#0C0D10;
  --behind:#F0B45A; --behind-soft:rgba(240,180,90,.18); --danger:#FF7A7F; --scrim:rgba(0,0,0,.6); --shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.st-ahead{color:var(--accent-text)} .st-behind{color:var(--behind)} .st-neutral,.st-done{color:var(--muted)}

/* Shell */
.app{max-width:560px;margin:0 auto;box-sizing:border-box;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:20px calc(116px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:24px}
#view.detail{gap:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
.circle-btn{flex:none;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;padding:0}
.circle-btn svg{width:18px;height:18px}
.pill-btn{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:transparent;font-size:14px}
.title-block{display:flex;flex-direction:column;gap:2px}
.h1{font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.summary{display:flex;gap:24px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
.summary div{display:flex;flex-direction:column;gap:2px}
.summary b{font-family:var(--mono);font-weight:400;font-size:22px;color:var(--ink)}
.summary b.st-behind{color:var(--behind)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px dashed var(--ghost);border-radius:14px;font-size:13px;color:var(--muted)}
.section-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:8px}

/* Goal rows */
.goal-list{display:flex;flex-direction:column;margin-top:-8px}
.goal-row{display:flex;flex-direction:column;gap:10px;padding:16px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;color:inherit}
.gr-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.gr-name{font-size:17px;font-weight:500;letter-spacing:-.01em;overflow-wrap:anywhere;min-width:0}
.gr-val{font-family:var(--mono);font-size:14px;white-space:nowrap}
.gr-val span{color:var(--muted)}
.gr-bot{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.gr-bot span:last-child{text-align:right}
.tick{position:relative;height:12px;display:flex;align-items:center}
.tick .track{height:3px;width:100%;border-radius:2px;background:var(--track);overflow:hidden}
.tick .fill{height:100%;background:var(--accent);border-radius:2px}
.tick .fill.behind{background:var(--behind)}
.tick .fill.done{background:var(--ink)}
.tick .mark{position:absolute;top:0;width:2px;height:12px;margin-left:-1px;background:var(--ink);border-radius:1px}
.segs{display:grid;gap:3px;height:12px;align-items:center}
.segs i{display:block;height:3px;border-radius:2px;background:var(--track)}
.segs i.on{background:var(--accent)}
.segs i.due{background:var(--behind-soft);box-shadow:inset 0 0 0 1px var(--behind)}

/* Empty state */
.empty{display:flex;flex-direction:column;gap:16px}
.empty-lead{font-size:15px;color:var(--muted);max-width:40ch}
.tpl-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tpl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:inherit;width:100%}
.tpl b{font-weight:500;display:block}
.tpl span{font-size:13px;color:var(--muted)}
.tpl svg{width:16px;height:16px;color:var(--muted);flex:none}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;box-sizing:border-box;padding:16px max(24px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,rgba(0,0,0,0))}
.dock[hidden]{display:none}
.dock-inner{max-width:512px;margin:0 auto;display:flex;gap:10px}
.btn{height:56px;border-radius:28px;border:0;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;flex:1;box-sizing:border-box}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--danger);color:var(--on-accent)}
.btn.sm{height:40px;font-size:14px;flex:none;padding:0 16px;border-radius:20px}
.btn.round{width:56px;flex:none;padding:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.link{border:0;background:none;padding:8px 0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.link.danger{color:var(--danger)}

/* Goal view */
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--card);min-width:0}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big-wrap{display:flex;align-items:baseline;gap:6px;min-width:0;flex-wrap:wrap}
.big{font-size:48px;font-weight:300;letter-spacing:-.05em;line-height:1}
.hero-side{text-align:right;flex:none}
.hero-side .mono{font-size:18px}
.chart{display:block;width:100%;height:auto}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:12px}
.stats3 .v{font-family:var(--mono);font-size:14px;overflow-wrap:anywhere}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-title{font-size:16px;font-weight:500}
.bars-scroll{overflow-x:auto;scrollbar-width:none}
.bars-scroll::-webkit-scrollbar{display:none}
.bars{display:flex;gap:4px;align-items:flex-end}
.bcol{flex:1 0 16px;min-width:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bbox{position:relative;width:100%;height:90px}
.bplan{position:absolute;left:0;right:0;bottom:0;border:1.5px dashed var(--ghost);border-radius:4px;box-sizing:border-box}
.bdone{position:absolute;left:0;right:0;bottom:0;background:var(--ink);border-radius:4px}
.bdone.now{background:var(--accent)} .bdone.miss{background:var(--behind)}
.blab{font-family:var(--mono);font-size:9px;color:var(--muted)}
.blab.now{color:var(--accent-text)}
.mrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mbar{height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent)}
.mbar i.over{background:var(--behind)}
.seg.four button{font-size:13px;padding:9px 2px}
.card.flush{padding-block:4px}
.sug{border:1px dashed var(--accent);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.row-line{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.row-line:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-title{overflow-wrap:anywhere}
.row-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.x-btn{flex:none;width:36px;height:36px;border-radius:18px;border:0;background:none;color:var(--muted);display:grid;place-items:center;padding:0}
.x-btn svg{width:15px;height:15px}
.confirm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;font-size:13px}
.check{flex:none;width:30px;height:30px;border-radius:15px;border:1.5px solid var(--ghost);background:none;color:var(--on-accent);display:grid;place-items:center;padding:0}
.check svg{width:15px;height:15px}
.check.on{background:var(--accent);border-color:var(--accent)}
.step-done .row-title{color:var(--muted);text-decoration:line-through}
.add-step{display:flex;gap:8px}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .18s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;display:flex;justify-content:center;pointer-events:none}
.sheet-panel{pointer-events:auto;width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;box-sizing:border-box;background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--shadow);padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:rise .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:18px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-title{font-size:22px;font-weight:500;letter-spacing:-.02em}
.sh-sub{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-size:13px;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px;width:100%;box-sizing:border-box;min-width:0}
.input:focus{outline:none;border-color:var(--accent)}
.input.big-in{font-family:var(--mono);font-size:32px;padding:10px 14px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.inline-unit{display:flex;align-items:center;gap:10px}
.inline-unit .input{flex:1}
.inline-unit span{color:var(--muted);flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:22px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:18px;padding:9px 6px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:transparent;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.preview{border-radius:14px;background:var(--track);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.preview b{font-weight:500}
.preview .warn{color:var(--behind)}
.err{color:var(--danger);font-size:13px}
.checks{display:flex;flex-direction:column;gap:2px}
.checkline{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 0}
.checkline input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.step-edit{display:grid;grid-template-columns:minmax(0,1fr) 140px 36px;gap:6px;align-items:center}
.step-edit .input{padding:10px 12px;font-size:15px}
.set-group{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.set-group:first-of-type{border-top:0;padding-top:0}
.set-title{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:22px;font-size:14px;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 48px);box-sizing:border-box;animation:toastIn .2s}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes toastIn{from{transform:translate(-50%,10px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app"><main id="view"></main></div>
<div class="dock" id="dock" hidden></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<script>
(() => {
"use strict";

const IN_CLAUDE = !!(window.claude && typeof window.claude.use === "function");

/* ---------- Utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const round1 = n => Math.round(n * 10) / 10;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const pad = n => String(n).padStart(2, "0");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dayKey(new Date());
const parseDay = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseDay(k); d.setDate(d.getDate() + n); return dayKey(d); };
const diffDays = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 864e5);
const mondayOf = k => addDays(k, -((parseDay(k).getDay() + 6) % 7));
const monthOf = k => k.slice(0, 7);
const WD = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const wdOf = k => (parseDay(k).getDay() + 6) % 7;
function addMonths(k, n){ const [y, m, d] = k.split("-").map(Number); const t = new Date(y, m - 1 + n, 1); const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(); return dayKey(new Date(t.getFullYear(), t.getMonth(), Math.min(d, last))); }
function monthsBetween(a, b){ let m = 0; while (m < 1200 && addMonths(a, m + 1) <= b) m++; return m; }
const nextMonth = m => { const [y, mo] = m.split("-").map(Number); return mo === 12 ? `${y + 1}-01` : `${y}-${pad(mo + 1)}`; };
const fmtD = k => parseDay(k).toLocaleDateString("en-GB", {day:"numeric", month:"short"});
const fmtDY = k => parseDay(k).toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"});
const monthName = m => parseDay(m + "-01").toLocaleDateString("en-GB", {month:"short"});
const fmt = n => (Math.round(Math.abs(n) * 100) / 100).toLocaleString("en-US", {maximumFractionDigits:2});
const fmtN = n => (n < 0 ? "−" : "") + fmt(n);
const fmtS = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(n);
const plural = (n, w, p) => `${w}${Math.abs(n) === 1 ? "" : (p ?? "s")}`;
const isNum = v => typeof v === "number" && isFinite(v);
function niceUp(x){
  if (!(x > 0)) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(x))), step = mag >= 10 ? mag / 10 : mag >= 1 ? 1 : mag;
  return round2(Math.ceil(x / step - 1e-9) * step);
}
function niceMax(x){
  if (!(x > 0)) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(x)));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * mag >= x - 1e-9) return round2(m * mag);
  return 10 * mag;
}

/* ---------- Icons ---------- */
const IC = {
  logo:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19L10 5h4L7 19z" fill="var(--ink)"/><path d="M11 19l7-14h3l-7 14z" fill="var(--accent)"/></svg>',
  sliders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M22 12h-3"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* ---------- Templates (suggestions when creating a goal) ---------- */
const TEMPLATES = [
  {label:"Run 100 km in 100 days", desc:"Total · about 7 km a week", d:{type:"total", name:"Run 100 km", unit:"km", target:100, endMode:"duration", durN:100, durU:"days"}},
  {label:"Read 12 books this year", desc:"Total · one a month", d:{type:"total", name:"Read 12 books", unit:"books", target:12, yearEnd:true}},

      actions:[{label:"Move one week out", act:"sug-due", v:s.id, primary:true}, {label:"Leave it", act:"sug-dismiss", v:"due"}]};

const num = v => (v === "" || v == null) ? NaN : Number(v);

function progDerived(d){
  const from = num(d.from), to = num(d.to), step = num(d.step), out = {ok:false};

  const p = progDefaults({freq:d.freq, days:d.days, stepEvery:d.stepEvery, measure:d.measure});
  if (d.freq === "days" && !(d.days || []).length) return {ok:false, why:"Pick at least one day."};
  if (d.calc === "end") {
    if (!isNum(to) || !isNum(step) || step === 0 || (to !== from && Math.sign(to - from) !== Math.sign(step))) return out;
    const k = Math.ceil(Math.abs(to - from) / Math.abs(step) - 1e-9), end = endForSteps(d.start, p, k);
    if (!end) return out;

  }
  if (!d.pEnd || d.pEnd < d.start) return out;
  const occ = occurrences(d.start, d.pEnd, p);
  if (!occ.length) return out;
  const steps = stepIdx(d.start, p, occ[occ.length - 1]), end = d.pEnd;
  if (d.calc === "step") { if (!isNum(to)) return out; return {ok:true, p, from, to, step:round2((to - from) / Math.max(1, steps)), steps, end, count:occ.length}; }

// live preview with the computed breakdown, plus warnings and suggestions
function updateGoalPreview(){
  const pv = $("#g-pv"); if (!pv || !sheet || sheet.type !== "goal") return;
  const d = sheet.draft, u = esc(d.unit || "units"), lines = [];
  if (d.type === "total") {
    const end = totalEnd(d), target = num(d.target);
    if (!end || !(target > 0)) { pv.innerHTML = `<span class="muted">Add a target and an end to see the breakdown.</span>`; return; }
    if (end < d.start) { pv.innerHTML = `<span class="warn">The end is before the start.</span>`; return; }
    const days = diffDays(d.start, end) + 1, perDay = target / days;
    if (d.less) lines.push(`<b>At most ${fmt(target)} ${u} in ${days} ${plural(days, "day")}</b>`, `Allowance ≈ ${fmt(round1(perDay * 7))} ${u} a week · ${fmt(round1(perDay * 30.4))} a month · ${fmt(round2(perDay))} a day`, `Ends ${fmtDY(end)} · less is better`);
    else lines.push(`<b>${fmt(target)} ${u} in ${days} ${plural(days, "day")}</b>`, `≈ ${fmt(round1(perDay * 7))} ${u} a week · ${fmt(round1(perDay * 30.4))} a month · ${fmt(round2(perDay))} a day`, `Ends ${fmtDY(end)}`);
    const unit = (d.unit || "").toLowerCase();
    if (!d.less && RUN_UNITS.includes(unit) && perDay * 7 > 80) lines.push(`<span class="warn">That's over 80 ${u} a week, which is a lot even for experienced runners.</span>`);
    if (!d.less && unit === "h" && perDay > 10) lines.push(`<span class="warn">That's more than 10 hours a day.</span>`);
    if (days < 7) lines.push(`<span class="warn">Shorter than a week, so there's no weekly breakdown.</span>`);
  } else if (d.type === "value") {
    const end = totalEnd(d), from = num(d.from), to = num(d.to);
    if (!isNum(from) || !isNum(to) || !end) { pv.innerHTML = `<span class="muted">Add a start value, a target and an end to see the pace.</span>`; return; }
    if (from === to) { pv.innerHTML = `<span class="warn">The target is the same as the start value.</span>`; return; }
    if (end <= d.start) { pv.innerHTML = `<span class="warn">The end must be after the start.</span>`; return; }
    const days = diffDays(d.start, end) + 1, wk = (to - from) / days * 7, unit = (d.unit || "").toLowerCase();
    lines.push(`<b>${fmt(from)} → ${fmt(to)} ${u} by ${fmtDY(end)}</b>`, `${fmtS(round2(wk))} ${u} a week · ${to < from ? "less" : "more"} is better · your latest entry counts`);
    if (unit === "kg" && wk < -1) lines.push(`<span class="warn">More than 1 kg a week is usually too fast to keep off. A later date may be easier to stick to.</span>`);
    if (unit === "lb" && wk < -2) lines.push(`<span class="warn">More than 2 lb a week is usually too fast to keep off. A later date may be easier to stick to.</span>`);
  } else if (d.type === "progression") {
    const r = progDerived(d);
    if (!r.ok) { pv.innerHTML = `<span class="muted">${esc(r.why || "Fill in the values to see the plan. Step and the direction (up or down) must match.")}</span>`; return; }
    const O = OCC[r.p.freq];
    lines.push(`<b>${fmt(r.from)} ${u} → ${fmt(r.to)} ${u}</b>`, `${fmtS(r.step)} ${u} ${esc(stepPhrase(r.p))} · ${esc(freqText(r.p))} · ${r.count} ${r.count === 1 ? O.one : O.many} · ends ${fmtDY(r.end)}`);
    if (r.to < r.from) lines.push(`Less is better: each ${O.one} counts as met when you stay at or under the level.`);
    const unit = (d.unit || "").toLowerCase(), perWeek = Math.abs(r.step) * stepsPerWeek(r.p);
    if (r.to > r.from && RUN_UNITS.includes(unit) && r.from > 0 && perWeek > r.from * 0.1 + 1e-9) {
      const sug = Math.max(0.5, Math.round(r.from * 0.1 / stepsPerWeek(r.p) * 2) / 2);
      lines.push(`<span class="warn">Runners usually add about 10% a week to avoid injury. Start with ${fmtS(sug)} ${u} a week?</span>${d.calc !== "step" ? ` <button class="link" data-act="apply-step" data-v="${sug}" style="padding:0">Use ${fmtS(sug)}</button>` : ""}`);
    }
    if (diffDays(d.start, r.end) > 730) lines.push(`<span class="warn">That plan runs over two years.</span>`);
  } else {
    const steps = d.steps.filter(s => s.title.trim());
    if (!steps.length) { pv.innerHTML = `<span class="muted">Add at least one step.</span>`; return; }
    const dated = steps.filter(s => s.due).sort((a, b) => a.due.localeCompare(b.due));
    lines.push(`<b>${steps.length} ${plural(steps.length, "step")}</b>`, dated.length ? `Last due ${fmtDY(dated[dated.length - 1].due)}` : "No due dates. Add some to see whether you're on time.");
  }
  pv.innerHTML = lines.join("");
}
async function saveGoal(){
  const err = $("#g-err"), fail = m => { err.textContent = m; err.hidden = false; };
  const d = sheet.draft, name = (d.name || "").trim();
  if (!name) return fail("Give the goal a name.");
  const existing = sheet.id ? goalById(sheet.id) : null;
  const g = existing ? existing : {id:newId(), createdAt:Date.now(), archived:false};
  if (existing && existing.example) delete g.example;
  if (d.type === "total") {
    const target = num(d.target), end = totalEnd(d), unit = (d.unit || "").trim();
    if (!(target > 0)) return fail("Set a target above 0.");
    if (!unit) return fail("Add a unit, like km or hours.");
    if (!d.start || !end) return fail("Set a start and an end.");
    if (end < d.start) return fail("The end must be after the start.");
    Object.assign(g, {type:"total", name, unit, target:round2(target), start:d.start, end, less:!!d.less});
    if (!g.less) delete g.less;
    delete g.prog; delete g.steps; delete g.from; delete g.to;
  } else if (d.type === "value") {
    const from = num(d.from), to = num(d.to), end = totalEnd(d), unit = (d.unit || "").trim();
    if (!isNum(from) || !isNum(to)) return fail("Add a start value and a target value.");
    if (from === to) return fail("The target has to differ from the start value.");
    if (!unit) return fail("Add a unit, like kg or min.");
    if (!d.start || !end) return fail("Set a start and an end.");
    if (end <= d.start) return fail("The end must be after the start.");
    Object.assign(g, {type:"value", name, unit, from:round2(from), to:round2(to), start:d.start, end});
    delete g.target; delete g.prog; delete g.steps; delete g.less;
  } else if (d.type === "progression") {
    const unit = (d.unit || "").trim(), r = progDerived(d);
    if (!unit) return fail("Add a unit, like km or reps.");
    if (!r.ok) return fail("Check the values. The step has to move from the start value toward the end value.");
    if (d.freq === "days" && !(d.days || []).length) return fail("Pick at least one day.");
    delete g.less; delete g.from; delete g.to;
    Object.assign(g, {type:"progression", name, unit, start:d.start, end:r.end, prog:progDefaults({from:r.from, to:r.to, step:r.step, measure:d.measure, freq:d.freq, days:(d.days || []).slice(), stepEvery:d.stepEvery})});
    delete g.target; delete g.steps;
  } else {
    const steps = d.steps.filter(s => s.title.trim()).map(s => ({id:s.id, title:s.title.trim(), due:s.due || "", done:!!s.done, doneAt:s.doneAt || ""}));
    if (!steps.length) return fail("Add at least one step.");
    delete g.less; delete g.from; delete g.to;
    Object.assign(g, {type:"milestone", name, unit:"", start:d.start || todayKey(), steps});
    const dues = steps.map(s => s.due).filter(Boolean).sort();
    g.end = dues.length ? dues[dues.length - 1] : "";
    delete g.target; delete g.prog;
  }
  if (!existing) S.goals.push(g);
  persist(); closeSheet();
  view = {name:"goal", id:g.id}; showAllLogs = false;
  render(); window.scrollTo(0, 0);
  toast(existing ? "Goal saved" : "Goal created");
}

  [[0, 85], [4, 84.6], [8, 84.7], [12, 84.1], [16, 83.8], [21, 83.6], [25, 83.1]].forEach(([o, v]) => add(addDays(wt.start, o), v, [wt.id]));
  [[1, 2], [5, 1], [12, 2], [19, 1], [24, 1]].forEach(([o, v]) => add(addDays(dr.start, o), v, [dr.id]));
  S.goals.push(run, gym, lr, wt, dr, read, web);
  invalidate(); persist(Object.keys(L));
}
function clearExamples(){
  S.goals = S.goals.filter(g => !g.example);
  const changed = [];
  for (const [k, m] of Object.entries(L)) { const n = m.entries.length; m.entries = m.entries.filter(e => !e.example); if (m.entries.length !== n) { m.updatedAt = Date.now(); changed.push(k); } }
  invalidate(); persist(changed);
}

/* ---------- Backup ---------- */
const backupJSON = () => JSON.stringify({app:"headway", format:1, exportedAt:new Date().toISOString(), S, L});
async function exportBackup(){
  const name = `headway-backup-${todayKey()}.json`, data = backupJSON();
  if (IN_CLAUDE) {
    let dl = null;
    try { dl = await window.claude.use("downloads"); } catch (e) {}
    if (dl) {
      try { await dl.save({filename:name, data}); toast("Backup saved"); return; }
      catch (e) { if (e && (e.code === "declined" || e.code === "rate_limited")) return; }
    }
    try { await navigator.clipboard.writeText(data); toast("Backup copied. Paste it into Import in the other app."); }
    catch (e) { toast("Saving files isn't available here. Try again from the claude.ai website."); }
    return;
  }
  try {
    const file = new File([data], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Headway backup"}); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(new Blob([data], {type:"application/json"})), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Backup downloaded");
}
function stageImport(text){
  let d = null;
  try { d = JSON.parse(text); } catch (e) {}
  if (!d || d.app !== "headway" || !d.S || !Array.isArray(d.S.goals) || typeof d.L !== "object") { toast("That isn't a Headway backup."); return; }
  sheet.importData = d; renderSheet();
}
async function applyImport(){
  const d = sheet.importData; if (!d) return;
  const oldMonths = Object.keys(L), theme = S.settings.theme;
  S = normalize(clone(d.S)); S.settings.theme = S.settings.theme || theme;
  L = {};
  for (const [k, m] of Object.entries(d.L || {})) if (/^\d{4}-\d{2}$/.test(k) && m && Array.isArray(m.entries)) L[k] = {month:k, entries:m.entries, updatedAt:Date.now()};
  invalidate();
  if (mode === "cloud") for (const k of oldMonths) if (!L[k]) { try { await db.doc(`${logsPath}/${k}`).delete(); } catch (e) {} }
  persist(Object.keys(L));
  closeSheet(); view = {name:"home"}; render();
  toast(`Imported ${S.goals.length} ${plural(S.goals.length, "goal")}`);
}

/* ---------- Toast ---------- */
let toastT = null;
function toast(msg){ const r = $("#toast-root"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => { r.innerHTML = ""; }, 2600); }

/* ---------- Events ---------- */
const H = {
  "home": () => { view = {name:"home"}; pendingDel = null; render(); window.scrollTo(0, 0); },
  "open-goal": t => { view = {name:"goal", id:t.dataset.id}; pendingDel = null; showAllLogs = false; render(); window.scrollTo(0, 0); },
  "open-settings": () => openSheet({type:"settings"}),
  "close-sheet": () => closeSheet(),
  "new-goal": () => openSheet({type:"goal", id:null, draft:blankDraft("total")}),
  "edit-goal": t => { const g = goalById(t.dataset.id); if (g) openSheet({type:"goal", id:g.id, draft:draftFromGoal(g)}); },
  "tpl": t => { const tp = TEMPLATES[+t.dataset.i]; openSheet({type:"goal", id:null, draft:draftFromTemplate(tp)}); },
  "g-type": t => { if (sheet.draft.type === t.dataset.v) return; const nd = blankDraft(t.dataset.v); nd.name = sheet.draft.name; sheet.draft = nd; renderSheet(); },
  "g-less": t => { sheet.draft.less = t.dataset.v === "1"; renderSheet(); },
  "g-seg": t => { sheet.draft[t.dataset.k] = t.dataset.v; renderSheet(); },
  "g-freq": t => { const d = sheet.draft; d.freq = t.dataset.v; if (!STEP_OPTS[d.freq].some(([v]) => v === d.stepEvery)) d.stepEvery = STEP_DEFAULT[d.freq]; if (!Array.isArray(d.days) || !d.days.length) d.days = [0, 2, 4]; renderSheet(); },
  "g-day": t => { const d = sheet.draft, v = Number(t.dataset.v); d.days = d.days.includes(v) ? d.days.filter(x => x !== v) : [...d.days, v].sort(); renderSheet(); },
  "g-add-step": () => { sheet.draft.steps.push({id:newId(), title:"", due:"", done:false}); renderSheet(); },
  "g-del-step": t => { sheet.draft.steps = sheet.draft.steps.filter(s => s.id !== t.dataset.step); renderSheet(); },
  "apply-step": t => { sheet.draft.step = Number(t.dataset.v); renderSheet(); },
  "save-goal": () => saveGoal(),
  "archive-goal": () => { const g = goalById(sheet.id); if (!g) return; g.archived = !g.archived; persist(); closeSheet(); if (g.archived) view = {name:"home"}; render(); toast(g.archived ? "Goal archived. Restore it from Settings." : "Goal restored"); },
  "ask-del-goal": () => { sheet.confirmDel = true; renderSheet(); },
  "cancel-del-goal": () => { sheet.confirmDel = false; renderSheet(); },
  "del-goal": () => { S.goals = S.goals.filter(g => g.id !== sheet.id); persist(); closeSheet(); view = {name:"home"}; render(); toast("Goal deleted"); },
  "restore-goal": t => { const g = goalById(t.dataset.id); if (g) { g.archived = false; persist(); render(); renderSheet(); toast("Goal restored"); } },
  "open-log": t => openSheet({type:"log", gid:t.dataset.id || (view.name === "goal" ? view.id : null), also:{}}),
  "log-goal": t => { sheet.gid = t.dataset.id; sheet.also = {}; renderSheet(); },
  "log-quick": t => { sheet.val = t.dataset.v; const i = $("#lg-val"); if (i) i.value = t.dataset.v; updateLogPreview(); },
  "log-day": t => { sheet.date = t.dataset.v; renderSheet(); },
  "save-log": () => saveLog(),
  "ask-del-log": t => { pendingDel = t.dataset.id; render(); },
  "cancel-del": () => { pendingDel = null; render(); },
  "del-log": t => {
    for (const [k, m] of Object.entries(L)) { const i = m.entries.findIndex(e => e.id === t.dataset.id); if (i >= 0) { m.entries.splice(i, 1); m.updatedAt = Date.now(); invalidate(); persist([k]); break; } }
    pendingDel = null; render(); toast("Entry deleted");
  },
  "toggle-logs": () => { showAllLogs = !showAllLogs; render(); },
  "toggle-step": t => { const g = goalById(t.dataset.id), s = g && g.steps.find(x => x.id === t.dataset.step); if (!s) return; s.done = !s.done; s.doneAt = s.done ? todayKey() : ""; persist(); render(); if (s.done && g.steps.every(x => x.done)) toast(`${g.name}: all steps done`); },
  "add-step": t => {
    const g = goalById(t.dataset.id), i = $("#new-step"), title = (i && i.value || "").trim();
    if (!g || !title) { if (i) i.focus(); return; }
    g.steps.push({id:newId(), title, due:"", done:false}); persist(); render(); const ni = $("#new-step"); if (ni) ni.focus();
  },
  "sug-dismiss": t => { S.dismissed[`${t.dataset.id}:${t.dataset.v}:${mondayOf(todayKey())}`] = true; persist(); render(); },
  "sug-raise": t => { const g = goalById(t.dataset.id); if (!g) return; g.target = Number(t.dataset.v); persist(); render(); toast(g.less ? `Limit lowered to ${fmt(g.target)} ${g.unit}` : `Goal raised to ${fmt(g.target)} ${g.unit}`); },
  "sug-extend": t => { const g = goalById(t.dataset.id); if (!g) return; g.end = addDays(g.end, Number(t.dataset.v)); persist(); render(); toast(`New end date: ${fmtDY(g.end)}`); },
  "sug-shift": t => { const g = goalById(t.dataset.id); if (!g) return; const w = Number(t.dataset.v); if (!shiftPlan(g, w)) return; persist(); render(); toast(w < 0 ? "Plan moved forward" : "Plan pushed back"); },
  "sug-due": t => { const g = goalById(t.dataset.id), s = g && g.steps.find(x => x.id === t.dataset.v); if (!s) return; s.due = addDays(todayKey(), 7); persist(); render(); toast(`Moved to ${fmtD(s.due)}`); },
  "set-theme": t => { S.settings.theme = t.dataset.v === "dark" ? "dark" : "light"; persist(); render(); renderSheet(); },
  "load-examples": () => { loadExamples(); closeSheet(); view = {name:"home"}; render(); toast("Example goals added"); },
  "clear-examples": () => { clearExamples(); closeSheet(); view = {name:"home"}; render(); toast("Examples cleared"); },
  "remove-old": () => removeOldData(),
  "ask-reset": () => { sheet.confirmReset = true; renderSheet(); },
  "cancel-reset": () => { sheet.confirmReset = false; renderSheet(); },
  "reset-all": () => resetAll(),
  "export": () => exportBackup(),
  "paste-open": () => { sheet.pasteOpen = true; renderSheet(); const t = $("#imp-text"); if (t) t.focus(); },
  "import-text": () => { const t = $("#imp-text"); if (t && t.value.trim()) stageImport(t.value.trim()); },
  "import-confirm": () => applyImport(),
  "import-cancel": () => { sheet.importData = null; renderSheet(); }
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const fn = H[t.dataset.act]; if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (!sheet) return;
  if (sheet.type === "goal") {
    if (el.dataset.f) { sheet.draft[el.dataset.f] = el.value; if (el.dataset.f === "start" || el.dataset.f === "durU") { renderSheet(); return; } updateGoalPreview(); }
    else if (el.dataset.step) { const s = sheet.draft.steps.find(x => x.id === el.dataset.step); if (s) s[el.dataset.sf] = el.value; updateGoalPreview(); }
  } else if (sheet.type === "log") {
    if (el.id === "lg-val") { sheet.val = el.value; updateLogPreview(); }
    else if (el.id === "lg-note") sheet.note = el.value;
    else if (el.id === "lg-date") { if (el.value) { sheet.date = el.value; renderSheet(); } }
    else if (el.dataset.also) sheet.also[el.dataset.also] = el.checked;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "imp-file" && e.target.files && e.target.files[0]) { const r = new FileReader(); r.onload = () => stageImport(String(r.result || "")); r.readAsText(e.target.files[0]); e.target.value = ""; return; } if (sheet && sheet.type === "log" && e.target.dataset && e.target.dataset.also) sheet.also[e.target.dataset.also] = e.target.checked; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheet) closeSheet();
  if (e.key === "Enter" && e.target.id === "new-step") { e.preventDefault(); const b = document.querySelector('[data-act="add-step"]'); if (b) b.click(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
setInterval(() => { const ae = document.activeElement; if (!sheet && !(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render(); }, 5 * 60 * 1000);

/* ---------- Sync ---------- */
let mode = "local", db = null, uid = null, statePath = null, logsPath = null, oldData = false;
const pendingW = new Map(), runningW = new Set();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
function queueSet(path, data){ pendingW.set(path, clone(data)); pump(path); }
async function pump(path){
  if (runningW.has(path)) return;
  runningW.add(path);
  try {
    while (pendingW.has(path)) {
      const d = pendingW.get(path); pendingW.delete(path);
      try { await db.doc(path).set(d); }
      catch (e) {
        if (e && e.code === "unavailable") { await sleep(400 + Math.random() * 900); try { await db.doc(path).set(d); } catch (e2) { writeFailed(e2); } }
        else writeFailed(e);
      }
    }
  } finally { runningW.delete(path); }
}
function writeFailed(e){ toast(e && e.code === "quota_exceeded" ? "Storage is full. Delete old entries to keep syncing." : "Couldn't sync that change. It's still saved on this device."); }
function persist(months = []){
  S.updatedAt = Date.now();
  saveLocal();
  if (mode === "cloud") { queueSet(statePath, S); for (const k of new Set(months)) if (L[k]) queueSet(`${logsPath}/${k}`, L[k]); }
}
function adopt(id, data){ L[id] = clone(data); invalidate(); }
async function connect(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  let user = null;
  try { [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]); } catch (e) { db = null; }
  if (!db || !user) { db = null; return; }
  try { uid = await user.id(); } catch (e) {}
  if (!uid) { db = null; return; }
  statePath = `data/users/${uid}/hw`; logsPath = `${statePath}/logs`;
  let snap;
  try { snap = await db.doc(statePath).get(); } catch (e) { db = null; return; }
  mode = "cloud";
  if (snap.exists && (snap.data().updatedAt || 0) >= (S.updatedAt || 0)) { S = normalize(clone(snap.data())); L = {}; invalidate(); }
  else { if (!S.updatedAt) S.updatedAt = Date.now(); queueSet(statePath, S); for (const k of Object.keys(L)) queueSet(`${logsPath}/${k}`, L[k]); }
  try {
    const qs = await db.collection(logsPath).limit(1000).get();
    for (const d of qs.docs) { const local = L[d.id]; if (d.exists && (!local || (d.data().updatedAt || 0) > (local.updatedAt || 0))) adopt(d.id, d.data()); }
  } catch (e) {}
  try { const o = await db.doc(`data/users/${uid}/state`).get(); oldData = !!o.exists; } catch (e) {}
  saveLocal();
  db.doc(statePath).onSnapshot(s => {
    if (s.metadata.hasPendingWrites || !s.exists) return;
    const r = s.data();
    if ((r.updatedAt || 0) > (S.updatedAt || 0)) { S = normalize(clone(r)); saveLocal(); render(); if (sheet && sheet.type === "settings") renderSheet(); }
  }, () => {});
  db.collection(logsPath).onSnapshot(qs => {
    let ch = false;
    for (const d of qs.docs) { if (d.metadata.hasPendingWrites || !d.exists) continue; const local = L[d.id]; if (!local || (d.data().updatedAt || 0) > (local.updatedAt || 0)) { adopt(d.id, d.data()); ch = true; } }
    if (ch) { saveLocal(); render(); }
  }, () => {});
  render();
}
async function removeOldData(){
  try { localStorage.removeItem("timequest.v1"); } catch (e) {}
  if (mode === "cloud" && uid) {
    try {
      const qs = await db.collection(`data/users/${uid}/state/months`).limit(1000).get();
      for (const d of qs.docs) { try { await db.doc(`data/users/${uid}/state/months/${d.id}`).delete(); } catch (e) {} }
      await db.doc(`data/users/${uid}/state`).delete();
    } catch (e) { toast("Couldn't remove all of the old data. Try again later."); return; }
  }
  oldData = false; renderSheet(); toast("Old Time Quest data removed");
}
async function resetAll(){
  if (mode === "cloud") for (const k of Object.keys(L)) { try { await db.doc(`${logsPath}/${k}`).delete(); } catch (e) {} }
  const theme = S.settings.theme;
  L = {}; invalidate(); S = blankState(); S.settings.theme = theme;
  persist(); closeSheet(); view = {name:"home"}; render(); toast("All Headway data deleted");
}

/* ---------- Boot ---------- */
const cached = loadLocal();
S = normalize(cached && cached.S);
L = (cached && cached.L) || {};
render();
if (IN_CLAUDE) connect();
else if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>

if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
